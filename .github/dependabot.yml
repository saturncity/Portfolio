version: 2
updates:
  # Actions are pinned to commit SHAs, so this is what moves them when the
  # upstream tag moves. Without it the pins silently rot.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]

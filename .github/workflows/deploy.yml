name: Deploy

on:
  push:
    branches: [main]
  # Pull requests build and get checked but never deploy, so a Dependabot
  # bump proves itself green before it reaches main.
  pull_request:
    branches: [main]
  workflow_dispatch:

# The job only reads the repo and pushes to Cloudflare. It never writes back
# to GitHub, so the token gets nothing else.
permissions:
  contents: read

# One deploy at a time, so two pushes can't interleave and leave the
# network half on one commit and half on another.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy every site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Bun runs the scripts, but Astro's CLI is a node shebang.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Checks gate the deploy. If any of these fail nothing ships,
      # which is the whole reason this is one job and not a matrix.
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

      - name: Deploy every site from this commit
        if: github.event_name != 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/deploy-targets.mjs > /tmp/targets
          {
            echo "### Deployed \`${GITHUB_SHA:0:7}\` to every site"
            echo
            echo "| Site | Live at | This deployment |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          count=0
          while read -r key project host; do
            echo "::group::$project -> $host"
            bunx wrangler pages deploy "apps/$key/dist" \
              --project-name="$project" \
              --branch=main \
              --commit-dirty=true > /tmp/out 2>&1 || { cat /tmp/out; exit 1; }
            cat /tmp/out
            url=$(grep -oE 'https://[a-z0-9.-]+\.pages\.dev' /tmp/out | tail -1)
            echo "| \`$key\` | [$host](https://$host) | [preview]($url) |" >> "$GITHUB_STEP_SUMMARY"
            count=$((count + 1))
            echo "::endgroup::"
          done < /tmp/targets
          {
            echo
            echo "$count sites, all from commit \`${GITHUB_SHA:0:7}\`."
          } >> "$GITHUB_STEP_SUMMARY"

name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time, so two pushes can't interleave and leave the
# network half on one commit and half on another.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      # Bun runs the scripts, but Astro's CLI is a node shebang.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Checks gate the deploy. If any of these fail nothing ships,
      # which is the whole reason this is one job and not a matrix.
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

      - name: Deploy every site from this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          node scripts/deploy-targets.mjs > /tmp/targets
          cat /tmp/targets
          while read -r key project; do
            echo "::group::$project"
            bunx wrangler pages deploy "apps/$key/dist" \
              --project-name="$project" \
              --branch=main \
              --commit-dirty=true
            echo "::endgroup::"
          done < /tmp/targets

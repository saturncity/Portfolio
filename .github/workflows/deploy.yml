name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# The job only reads the repo and pushes to Cloudflare. It never writes back
# to GitHub, so the token gets nothing else.
permissions:
  contents: read

# One deploy at a time, so two pushes can't interleave and leave the
# network half on one commit and half on another.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.4.2

      # Bun runs the scripts, but Astro's CLI is a node shebang.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version-file: .node-version

      - run: bun install --frozen-lockfile

      # Checks gate the deploy. If any of these fail nothing ships,
      # which is the whole reason this is one job and not a matrix.
      - run: bun run lint
      - run: bun run format:check
      - run: bun run build

      - name: Deploy every site from this commit
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ]; then
            echo "::notice::CLOUDFLARE_API_TOKEN is not set, so nothing was deployed. The build above still ran. See the Deploying section of the README for the one-time setup."
            exit 0
          fi
          node scripts/deploy-targets.mjs > /tmp/targets
          cat /tmp/targets
          while read -r key project host; do
            echo "::group::$project"
            bunx wrangler pages deploy "apps/$key/dist" \
              --project-name="$project" \
              --branch=main \
              --commit-dirty=true
            echo "::endgroup::"
          done < /tmp/targets
